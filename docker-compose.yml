# TestFlow — Autonomous SQA Agent
# Single-command self-hosting: docker compose up -d

services:
  testflow:
    build: .
    image: testflow:latest
    container_name: testflow
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - ./data:/app/data   # SQLite database, reports, and screenshots persist here
    restart: unless-stopped
